name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please do not paste your personal notes, log files, Claude Code transcripts or commit messages from private repositories into this issue.** Describe the problem, or use made-up text that shows it. Gloamlog is alpha software, so bugs are expected and useful.
        For security problems, use the [private security advisory form](https://github.com/dasariprashant0/gloamlog/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings > Sources
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gloamlog version
      description: Shown in Gloamlog > About Gloamlog. Use the release tag, or the commit if you built from source.
      placeholder: 0.6.5
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.1, Apple silicon
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - install.sh installer
        - Manual download from Releases
        - Built from source
        - In-app update
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots with private text hidden, or notes. Again, no private log contents.
