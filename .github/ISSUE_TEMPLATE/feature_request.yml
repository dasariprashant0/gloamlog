name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Gloamlog is small on purpose: local-only, plain markdown files, no accounts, no third-party dependencies. Ideas that fit that are most likely to be accepted. Please do not paste personal notes into this issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Fits the project
      options:
        - label: It works without network access or telemetry
          required: true
        - label: It keeps notes as plain markdown files in the user's folder
          required: true
        - label: I would be willing to help build or test it
          required: false
